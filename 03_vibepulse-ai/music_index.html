<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibePulse AI — Worldwide Music & AI Moods</title>
  <link rel="manifest" href="/manifest.json" />
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #07050e;
      --card-bg: rgba(20, 16, 38, 0.75);
      --primary: #00f2fe;
      --secondary: #9b51e0;
      --pink: #ff007f;
      --text: #ffffff;
      --text-dim: #9499c0;
      --accent-green: #00e676;
      --glass-border: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    
    body {
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(155, 81, 224, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.2) 0%, transparent 40%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }

    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-container { display: flex; gap: 6px; }
    .badge {
      background: rgba(0, 230, 118, 0.12);
      color: var(--accent-green);
      border: 1px solid rgba(0, 230, 118, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Security Banner */
    .sec-shield {
      background: rgba(0, 242, 254, 0.06);
      border: 1px dashed rgba(0, 242, 254, 0.3);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sec-shield strong { color: var(--primary); }

    /* SEARCH BAR COMPONENT */
    .search-box {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
    }
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px 42px 12px 40px;
      color: var(--text);
      font-size: 13.5px;
      outline: none;
      transition: all 0.3s ease;
    }
    .search-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }
    .search-icon {
      position: absolute;
      left: 14px;
      color: var(--primary);
      font-size: 14px;
    }
    .clear-icon {
      position: absolute;
      right: 14px;
      color: var(--text-dim);
      font-size: 14px;
      cursor: pointer;
      display: none;
    }
    .clear-icon:hover { color: var(--text); }

    /* Search Quick Tags */
    .quick-tags {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .quick-tags::-webkit-scrollbar { display: none; }
    .tag-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      padding: 5px 12px;
      border-radius: 14px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }
    .tag-btn:hover { background: var(--secondary); color: white; }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 18px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: var(--text-dim);
      font-size: 12px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(155, 81, 224, 0.3));
      color: var(--text);
      border: 1px solid rgba(0, 242, 254, 0.4);
    }

    /* AI Mood Card */
    .mood-card {
      background: linear-gradient(135deg, rgba(155, 81, 224, 0.15), rgba(0, 242, 254, 0.08));
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 12px;
      text-align: center;
    }
    .mood-title { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
    .mood-selector { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
    .btn-mood {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: var(--text);
      padding: 6px 12px; border-radius: 16px; font-size: 11px; cursor: pointer; transition: 0.3s;
    }
    .btn-mood.active { background: var(--primary); color: #000; font-weight: 700; box-shadow: 0 0 12px rgba(0, 242, 254, 0.4); }

    /* Player Card GUI */
    .player-card {
      background: rgba(0,0,0,0.35);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .album-art-container {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .album-art {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.2);
      animation: spin 16s linear infinite paused;
      background: #151126;
    }
    .album-art.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Audio Visualizer Waves */
    .sound-wave {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
      position: absolute;
      bottom: 6px;
    }
    .bar {
      width: 3px;
      background: var(--primary);
      border-radius: 3px;
      height: 4px;
      transition: height 0.2s;
    }
    .playing .bar { animation: wave 0.8s ease-in-out infinite alternate; }
    .playing .bar:nth-child(2) { animation-delay: 0.2s; }
    .playing .bar:nth-child(3) { animation-delay: 0.4s; }
    .playing .bar:nth-child(4) { animation-delay: 0.1s; }
    @keyframes wave { 0% { height: 4px; } 100% { height: 16px; } }

    .song-details { text-align: center; width: 100%; }
    .song-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; margin: 0 auto; }
    .artist-name { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

    /* Progress Bar (Scrubber) */
    .progress-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      transition: width 0.1s linear;
    }
    .time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Controls */
    .controls { display: flex; align-items: center; gap: 16px; }
    .btn-control {
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: white;
      width: 40px; height: 40px; border-radius: 50%; font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.2s;
    }
    .btn-control:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
    .btn-play {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      font-size: 20px; color: #000; border: none;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    /* Track List / Search Results */
    .track-section { width: 100%; }
    .section-title { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .track-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; padding-right: 2px; }
    .track-list::-webkit-scrollbar { width: 4px; }
    .track-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    
    .track-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.05);
      padding: 8px 12px; border-radius: 14px; font-size: 12px; cursor: pointer; transition: 0.2s;
    }
    .track-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(0, 242, 254, 0.3); }
    .track-item.active { border-left: 3px solid var(--primary); background: rgba(0, 242, 254, 0.12); }
    .track-thumb { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; }
    .track-info { flex: 1; overflow: hidden; }
    .track-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .track-artist { font-size: 10px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .loading-spinner { text-align: center; padding: 20px; color: var(--primary); font-size: 13px; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <i class="fa-solid fa-compact-disc fa-spin" style="--fa-animation-duration: 8s;"></i> VibePulse AI
      </div>
      <div class="badge-container">
        <div class="badge">100% Free</div>
        <div class="badge" style="color: var(--primary); border-color: var(--primary); background: rgba(0,242,254,0.1);">Global</div>
      </div>
    </div>

    <!-- Security Banner -->
    <div class="sec-shield">
      <span><i class="fa-solid fa-shield-halved"></i> Zero-Trust Shield: <strong>AES-256 Encrypted</strong></span>
      <span style="color: var(--accent-green); font-weight: bold;">● Active</span>
    </div>

    <!-- Live Search Input -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="search-input" class="search-input" placeholder="Search any song, artist, or album worldwide..." onkeyup="handleSearchKey(event)">
      <i class="fa-solid fa-xmark clear-icon" id="clear-search" onclick="clearSearch()"></i>
    </div>

    <!-- Quick Tags -->
    <div class="quick-tags">
      <button class="tag-btn" onclick="quickSearch('Top Hits 2026')">🔥 New Hits</button>
      <button class="tag-btn" onclick="quickSearch('Global Billboard Trending')">🌍 Global Top</button>
      <button class="tag-btn" onclick="quickSearch('Taylor Swift')">⭐ Taylor Swift</button>
      <button class="tag-btn" onclick="quickSearch('The Weeknd')">⚡ The Weeknd</button>
      <button class="tag-btn" onclick="quickSearch('Lo-Fi Beats')">🎧 Lo-Fi Chill</button>
    </div>

    <!-- Nav Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" id="tab-search" onclick="switchTab('search')"><i class="fa-solid fa-globe"></i> Search Results</button>
      <button class="tab-btn" id="tab-new" onclick="switchTab('new')"><i class="fa-solid fa-fire"></i> New Releases</button>
      <button class="tab-btn" id="tab-mood" onclick="switchTab('mood')"><i class="fa-solid fa-brain"></i> AI Moods</button>
    </div>

    <!-- AI Mood Radar (Shown under AI Moods tab) -->
    <div class="mood-card" id="mood-card" style="display: none;">
      <div class="mood-title">AI Mood Radar</div>
      <div class="mood-selector">
        <button class="btn-mood active" onclick="setMood('Chill', 0)">☕ Chill</button>
        <button class="btn-mood" onclick="setMood('Energetic', 1)">⚡ Energetic</button>
        <button class="btn-mood" onclick="setMood('Focus', 2)">🎧 Focus</button>
        <button class="btn-mood" onclick="setMood('Happy', 3)">🌟 Happy</button>
      </div>
    </div>

    <!-- Audio Player GUI -->
    <div class="player-card">
      <div class="album-art-container">
        <img src="https://cdn-icons-png.flaticon.com/512/3844/3844724.png" id="album-cover" class="album-art" alt="Album Cover">
        <div class="sound-wave" id="visualizer">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>

      <div class="song-details">
        <div class="song-title" id="song-title">Search or Pick a Song</div>
        <div class="artist-name" id="artist-name">VibePulse AI Music</div>
      </div>

      <!-- Scrubber -->
      <div class="progress-container">
        <div class="progress-bar-bg" onclick="seekAudio(event)">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
        <div class="time-stamps">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="controls">
        <button class="btn-control" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-control btn-play" id="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <button class="btn-control" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>

    <!-- Results / Playlist Queue -->
    <div class="track-section">
      <div class="section-title">
        <span id="list-heading">NOW PLAYING QUEUE</span>
        <span style="color: var(--primary);" id="track-count">0 Songs</span>
      </div>
      <div class="track-list" id="track-list">
        <!-- Dynamically rendered -->
      </div>
    </div>

  </div>

  <script>
    // State management
    let activeTab = 'search';
    let currentSongs = [];
    let currentIndex = 0;
    let isPlaying = false;
    let audio = new Audio();
    let searchTimeout = null;

    // Default Mood Playlists
    const moodPlaylists = {
      Chill: [
        { title: "Cybernetic Waves", artist: "AuraPulse Studio", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3", cover: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=300&q=80" },
        { title: "Midnight Lo-Fi", artist: "Synth Chill", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3", cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300&q=80" }
      ],
      Energetic: [
        { title: "Hyperdrive Pulse", artist: "VibeCrypt EDM", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3", cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300&q=80" }
      ],
      Focus: [
        { title: "Deep Mindscape", artist: "Alpha Waves", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3", cover: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&q=80" }
      ],
      Happy: [
        { title: "Electric Horizon", artist: "Sun Pulse", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3", cover: "https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=300&q=80" }
      ]
    };

    // Global Worldwide Song Search Function via iTunes & JioSaavn APIs
    async function searchGlobalSongs(query) {
      if (!query || query.trim() === '') return;
      
      const container = document.getElementById('track-list');
      container.innerHTML = `<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Searching songs around the world...</div>`;
      document.getElementById('list-heading').innerText = `SEARCH RESULTS FOR "${query.toUpperCase()}"`;

      try {
        // Fetch from iTunes API (Worldwide music catalog)
        const response = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=25`);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
          currentSongs = data.results.map(item => ({
            title: item.trackName,
            artist: item.artistName,
            audio: item.previewUrl,
            cover: item.artworkUrl100.replace('100x100bb', '400x400bb')
          }));

          renderTrackList();
          loadSong(0, false);
        } else {
          container.innerHTML = `<div style="text-align:center; color: var(--text-dim); padding: 15px;">No songs found. Try another search!</div>`;
        }
      } catch (err) {
        console.error("Search API error:", err);
        container.innerHTML = `<div style="text-align:center; color: var(--pink); padding: 15px;">Search error. Check your internet connection.</div>`;
      }
    }

    // Fetch Newly Released Worldwide Songs
    async function fetchNewReleases() {
      document.getElementById('list-heading').innerText = "🔥 NEWLY RELEASED WORLDWIDE HITS";
      searchGlobalSongs("2026 Top Hits New Release");
    }

    function handleSearchKey(e) {
      const input = document.getElementById('search-input');
      document.getElementById('clear-search').style.display = input.value ? 'block' : 'none';

      clearTimeout(searchTimeout);
      if (e.key === 'Enter') {
        switchTab('search');
        searchGlobalSongs(input.value);
      } else {
        searchTimeout = setTimeout(() => {
          if (input.value.length >= 3) {
            switchTab('search');
            searchGlobalSongs(input.value);
          }
        }, 600);
      }
    }

    function quickSearch(tag) {
      document.getElementById('search-input').value = tag;
      document.getElementById('clear-search').style.display = 'block';
      switchTab('search');
      searchGlobalSongs(tag);
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search').style.display = 'none';
    }

    function switchTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      const moodCard = document.getElementById('mood-card');
      if (tab === 'mood') {
        moodCard.style.display = 'block';
        setMood('Chill', 0);
      } else {
        moodCard.style.display = 'none';
        if (tab === 'new') {
          fetchNewReleases();
        }
      }
    }

    function setMood(mood, btnIndex) {
      document.querySelectorAll('.btn-mood').forEach((btn, i) => btn.classList.toggle('active', i === btnIndex));
      document.getElementById('list-heading').innerText = `AI MOOD: ${mood.toUpperCase()} QUEUE`;
      currentSongs = moodPlaylists[mood];
      renderTrackList();
      loadSong(0, false);
    }

    function loadSong(index, autoPlay = true) {
      if (currentSongs.length === 0) return;
      if (index >= currentSongs.length) index = 0;
      if (index < 0) index = currentSongs.length - 1;

      currentIndex = index;
      const song = currentSongs[currentIndex];

      document.getElementById('song-title').innerText = song.title;
      document.getElementById('artist-name').innerText = song.artist;
      document.getElementById('album-cover').src = song.cover || "https://cdn-icons-png.flaticon.com/512/3844/3844724.png";
      
      audio.src = song.audio;
      
      renderTrackList();

      if (autoPlay) {
        audio.play().then(() => {
          isPlaying = true;
          updatePlayStateUI();
        }).catch(err => console.log("Autoplay blocked:", err));
      }
    }

    function togglePlay() {
      if (currentSongs.length === 0) return;
      if (isPlaying) {
        audio.pause();
        isPlaying = false;
      } else {
        audio.play().then(() => {
          isPlaying = true;
        }).catch(err => console.log("Play error:", err));
      }
      updatePlayStateUI();
    }

    function updatePlayStateUI() {
      const playBtn = document.getElementById('play-btn');
      const cover = document.getElementById('album-cover');
      const visualizer = document.getElementById('visualizer');

      if (isPlaying) {
        playBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        cover.classList.add('playing');
        visualizer.classList.add('playing');
      } else {
        playBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        cover.classList.remove('playing');
        visualizer.classList.remove('playing');
      }
    }

    function nextSong() {
      loadSong(currentIndex + 1, true);
    }

    function prevSong() {
      loadSong(currentIndex - 1, true);
    }

    function renderTrackList() {
      const container = document.getElementById('track-list');
      document.getElementById('track-count').innerText = `${currentSongs.length} Songs`;

      container.innerHTML = currentSongs.map((song, i) => `
        <div class="track-item ${i === currentIndex ? 'active' : ''}" onclick="loadSong(${i}, true)">
          <img src="${song.cover}" class="track-thumb" alt="art">
          <div class="track-info">
            <div class="track-name">${song.title}</div>
            <div class="track-artist">${song.artist}</div>
          </div>
          <i class="fa-solid ${i === currentIndex && isPlaying ? 'fa-pause' : 'fa-play'}" style="color: var(--primary);"></i>
        </div>
      `).join('');
    }

    // Progress Bar Scrubber
    audio.ontimeupdate = () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progress-fill').style.width = `${pct}%`;
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-duration').innerText = formatTime(audio.duration);
      }
    };

    function seekAudio(e) {
      const bg = e.currentTarget;
      const rect = bg.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      if (audio.duration) {
        audio.currentTime = (clickX / width) * audio.duration;
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // Auto next track when current song finishes
    audio.onended = () => nextSong();

    // Initial Load - Trending Music
    searchGlobalSongs("Top Hits 2026");
  </script>
</body>
