<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibePulse AI — Secure Ad-Free Music</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0b0914;
      --card-bg: rgba(23, 20, 41, 0.7);
      --primary: #00f2fe;
      --secondary: #9b51e0;
      --text: #ffffff;
      --text-dim: #a0a5c0;
      --accent-green: #00e676;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
    
    .app-container {
      width: 100%; max-width: 440px; background: var(--card-bg);
      backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; gap: 20px; position: relative; overflow: hidden;
    }

    .header { display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid var(--accent-green); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }

    /* Security Dashboard Banner */
    .sec-shield {
      background: rgba(0, 242, 254, 0.08); border: 1px dashed var(--primary);
      border-radius: 16px; padding: 12px; font-size: 12px; color: var(--text-dim);
      display: flex; align-items: center; justify-content: space-between;
    }
    .sec-shield strong { color: var(--primary); }

    /* AI Mood Radar Card */
    .mood-card {
      background: linear-gradient(135deg, rgba(155, 81, 224, 0.2), rgba(0, 242, 254, 0.1));
      border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: 16px; text-align: center;
    }
    .mood-title { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
    .mood-selector { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .btn-mood {
      background: rgba(255,255,255,0.08); border: none; color: var(--text);
      padding: 8px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: 0.3s;
    }
    .btn-mood:hover, .btn-mood.active { background: var(--primary); color: #000; font-weight: 700; }

    /* Player Visualizer */
    .player-card {
      background: rgba(0,0,0,0.3); border-radius: 20px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .album-art {
      width: 140px; height: 140px; border-radius: 50%; background: linear-gradient(45deg, var(--secondary), var(--primary));
      box-shadow: 0 10px 30px rgba(0, 242, 254, 0.3); display: flex; align-items: center; justify-content: center; font-size: 48px;
      animation: spin 12s linear infinite paused;
    }
    .album-art.playing { animation-play-state: running; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .song-title { font-size: 18px; font-weight: 700; margin-top: 6px; }
    .artist-name { font-size: 13px; color: var(--text-dim); }

    /* Controls */
    .controls { display: flex; align-items: center; gap: 20px; }
    .btn-control {
      background: rgba(255,255,255,0.1); border: none; color: white;
      width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .btn-play { width: 56px; height: 56px; background: linear-gradient(135deg, var(--primary), var(--secondary)); font-size: 24px; color: #000; font-weight: bold; }

    /* Queue List */
    .queue-section { width: 100%; }
    .queue-header { font-size: 13px; color: var(--text-dim); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .queue-list { display: flex; flex-direction: column; gap: 8px; max-height: 140px; overflow-y: auto; }
    .queue-item {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 12px; font-size: 13px;
    }
    .queue-item.active { border-left: 3px solid var(--primary); background: rgba(0, 242, 254, 0.1); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="brand">VibePulse AI</div>
      <div class="badge">100% Ads-Free</div>
    </div>

    <!-- Security Shield -->
    <div class="sec-shield">
      <span>🛡️ Zero-Trust Shield: <strong>AES-256 Encrypted</strong></span>
      <span style="color: var(--accent-green); font-weight: bold;">● Active</span>
    </div>

    <!-- AI Mood Detector -->
    <div class="mood-card">
      <div class="mood-title">🧠 AI Mood Sensing Radar</div>
      <div id="mood-status" style="font-size: 14px; font-weight: 600;">Current Mood: <span style="color:var(--primary)">Chill</span></div>
      <div class="mood-selector">
        <button class="btn-mood active" onclick="setMood('Chill', 0)">☕ Chill</button>
        <button class="btn-mood" onclick="setMood('Energetic', 1)">⚡ Energetic</button>
        <button class="btn-mood" onclick="setMood('Focus', 2)">🎧 Focus</button>
        <button class="btn-mood" onclick="setMood('Happy', 3)">🌟 Happy</button>
      </div>
    </div>

    <!-- Audio Player -->
    <div class="player-card">
      <div class="album-art" id="disc">🎵</div>
      <div style="text-align: center;">
        <div class="song-title" id="song-title">Cybernetic Waves</div>
        <div class="artist-name" id="artist-name">AuraPulse Studio</div>
      </div>

      <div class="controls">
        <button class="btn-control" onclick="prevSong()">⏮</button>
        <button class="btn-control btn-play" id="play-btn" onclick="togglePlay()">▶</button>
        <button class="btn-control" onclick="nextSong()">⏭</button>
      </div>
    </div>

    <!-- Sequential Playlist Queue -->
    <div class="queue-section">
      <div class="queue-header">
        <span>PLAYLIST QUEUE (Sequential Order)</span>
        <span style="color: var(--primary)">No Random Shuffle</span>
      </div>
      <div class="queue-list" id="queue-list">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    const playlists = {
      Chill: [
        { title: "Cybernetic Waves", artist: "AuraPulse Studio", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
        { title: "Midnight Lo-Fi", artist: "Synth Chill", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" },
        { title: "Neon Sunset", artist: "ZeroTrust Beats", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" }
      ],
      Energetic: [
        { title: "Hyperdrive Pulse", artist: "VibeCrypt EDM", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3" },
        { title: "Cyberpunk Rush", artist: "Overclock", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3" }
      ],
      Focus: [
        { title: "Deep Mindscape", artist: "Alpha Waves", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3" }
      ],
      Happy: [
        { title: "Electric Horizon", artist: "Sun Pulse", audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3" }
      ]
    };

    let currentMood = 'Chill';
    let currentIndex = 0;
    let isPlaying = false;
    let audio = new Audio();

    function loadSong(index) {
      const queue = playlists[currentMood];
      if (index >= queue.length) index = 0;
      if (index < 0) index = queue.length - 1;

      currentIndex = index;
      const song = queue[currentIndex];
      document.getElementById('song-title').innerText = song.title;
      document.getElementById('artist-name').innerText = song.artist;
      audio.src = song.audio;

      renderQueue();
    }

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        document.getElementById('play-btn').innerText = '▶';
        document.getElementById('disc').classList.remove('playing');
      } else {
        audio.play();
        document.getElementById('play-btn').innerText = '⏸';
        document.getElementById('disc').classList.add('playing');
      }
      isPlaying = !isPlaying;
    }

    function nextSong() {
      loadSong(currentIndex + 1);
      if (isPlaying) audio.play();
    }

    function prevSong() {
      loadSong(currentIndex - 1);
      if (isPlaying) audio.play();
    }

    function setMood(mood, btnIndex) {
      currentMood = mood;
      document.getElementById('mood-status').innerHTML = `Current Mood: <span style="color:var(--primary)">${mood}</span>`;
      
      const buttons = document.querySelectorAll('.btn-mood');
      buttons.forEach((btn, i) => btn.classList.toggle('active', i === btnIndex));

      loadSong(0);
      if (isPlaying) audio.play();
    }

    function renderQueue() {
      const queue = playlists[currentMood];
      const container = document.getElementById('queue-list');
      container.innerHTML = queue.map((song, i) => `
        <div class="queue-item ${i === currentIndex ? 'active' : ''}" onclick="loadSong(${i}); if(isPlaying) audio.play();">
          <div>
            <strong>${i + 1}. ${song.title}</strong>
            <div style="font-size:11px; color: var(--text-dim);">${song.artist}</div>
          </div>
          <span style="font-size:11px; color: var(--primary)">${i === currentIndex ? 'Playing' : 'In Queue'}</span>
        </div>
      `).join('');
    }

    // Auto next track when current track finishes (Sequential Order)
    audio.onended = () => nextSong();

    // Initial load
    loadSong(0);
  </script>
</body>
</html>
