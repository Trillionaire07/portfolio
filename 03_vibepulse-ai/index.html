<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VibePulse AI - Full Length Music</title>
  
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0a0e1a" />
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: #0a0e1a; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 15px; }
    
    .app-container { width: 100%; max-width: 480px; background: #121829; border-radius: 24px; padding: 20px; border: 1px solid #1e293b; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .logo { font-size: 1.4rem; font-weight: 800; background: linear-gradient(135deg, #1db954, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { background: rgba(29, 185, 84, 0.15); color: #1db954; border: 1px solid #1db954; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }

    .shield-bar { background: rgba(6, 182, 212, 0.08); border: 1px dashed rgba(6, 182, 212, 0.4); border-radius: 12px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #94a3b8; margin-bottom: 15px; }
    .shield-bar i { color: #06b6d4; margin-right: 6px; }

    .search-box { position: relative; margin-bottom: 18px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 42px; background: #1e293b; border: 1px solid #334155; border-radius: 14px; color: #fff; font-size: 0.9rem; outline: none; transition: 0.3s; }
    .search-box input:focus { border-color: #1db954; box-shadow: 0 0 12px rgba(29, 185, 84, 0.3); }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #64748b; }
    .search-loader { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); display: none; color: #1db954; }

    .mood-radar { background: #1a2236; border-radius: 16px; padding: 14px; margin-bottom: 20px; border: 1px solid #28354e; }
    .mood-title { font-size: 0.75rem; font-weight: 700; color: #ec4899; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .mood-buttons { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .mood-btn { background: #243049; border: 1px solid #334155; color: #cbd5e1; padding: 8px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .mood-btn.active, .mood-btn:hover { background: linear-gradient(135deg, #1db954, #06b6d4); color: #fff; border-color: transparent; }

    .player-card { background: linear-gradient(180deg, #182238 0%, #0f172a 100%); border-radius: 20px; padding: 20px; text-align: center; border: 1px solid #28354e; margin-bottom: 20px; position: relative; }
    
    .album-art { width: 170px; height: 170px; border-radius: 20px; margin: 0 auto 15px; background: #222d45; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #334155; overflow: hidden; position: relative; transition: 0.3s; }
    .album-art img { width: 100%; height: 100%; object-fit: cover; }
    .playing .album-art { border-color: #1db954; box-shadow: 0 0 30px rgba(29, 185, 84, 0.4); transform: scale(1.02); }

    .track-title { font-size: 1.15rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist-name { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }

    .progress-container { margin-bottom: 15px; }
    .progress-bar { width: 100%; height: 6px; background: #334155; border-radius: 3px; cursor: pointer; position: relative; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #1db954, #06b6d4); }
    .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #64748b; margin-top: 6px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 10px; }
    .btn-ctrl { background: #243049; border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
    .btn-play { width: 56px; height: 56px; background: #1db954; color: #000; font-size: 1.4rem; box-shadow: 0 0 20px rgba(29, 185, 84, 0.4); }
    .btn-ctrl:hover { transform: scale(1.08); }

    .queue-section { margin-top: 10px; }
    .queue-header { font-size: 0.8rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .queue-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; }
    .queue-item { display: flex; align-items: center; gap: 12px; background: #1a2236; padding: 10px 12px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .queue-item:hover, .queue-item.active { border-color: #1db954; background: #222d45; }
    .queue-thumb { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; }
    .queue-details { flex: 1; overflow: hidden; }
    .queue-name { font-size: 0.85rem; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-artist { font-size: 0.75rem; color: #64748b; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <div class="logo"><i class="fa-brands fa-spotify"></i> VibePulse AI</div>
      <div class="badge">320kbps • Zero Ads</div>
    </div>

    <div class="shield-bar">
      <span><i class="fa-solid fa-shield-halved"></i> Direct Audio Stream Engine</span>
      <span style="color:#1db954;">• HD Audio</span>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search any song (e.g. Yalgaar, Kesariya)..." onkeypress="handleSearch(event)" />
      <i class="fa-solid fa-spinner fa-spin search-loader" id="search-loader"></i>
    </div>

    <div class="mood-radar">
      <div class="mood-title"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Mood Radar</div>
      <div class="mood-buttons">
        <button class="mood-btn active" onclick="searchMusic('Yalgaar CarryMinati', this)">🔥 Yalgaar</button>
        <button class="mood-btn" onclick="searchMusic('Arijit Singh Hits', this)">❤️ Arijit Singh</button>
        <button class="mood-btn" onclick="searchMusic('Punjabi Hit Songs', this)">🎵 Punjabi Hits</button>
        <button class="mood-btn" onclick="searchMusic('Taylor Swift', this)">🌟 Taylor Swift</button>
        <button class="mood-btn" onclick="searchMusic('Global Top Hits', this)">🌍 Top Global</button>
      </div>
    </div>

    <div class="player-card" id="player-card">
      <div class="album-art">
        <img id="album-img" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500" alt="Album Cover" />
      </div>
      <div class="track-title" id="track-title">Select a song</div>
      <div class="artist-name" id="artist-name">VibePulse Audio Engine</div>

      <div class="progress-container" onclick="seekTrack(event)">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="btn-ctrl" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
        <button class="btn-ctrl btn-play" id="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play"></i></button>
        <button class="btn-ctrl" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
      </div>
    </div>

    <div class="queue-section">
      <div class="queue-header">
        <span>Songs Queue</span>
        <span id="queue-count" style="color:#1db954;">0 Tracks</span>
      </div>
      <div class="queue-list" id="queue-list"></div>
    </div>
  </div>

  <!-- Native HTML5 Audio Object -->
  <audio id="audio-engine" preload="auto"></audio>

  <script>
    let currentQueue = [];
    let currentIndex = 0;
    let isPlaying = false;
    const audio = document.getElementById('audio-engine');

    window.onload = () => {
      searchMusic("Yalgaar CarryMinati");
    };

    // Native Audio Event Listeners
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('ended', nextSong);
    audio.addEventListener('play', () => {
      isPlaying = true;
      document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-pause"></i>';
      document.getElementById('player-card').classList.add('playing');
    });
    audio.addEventListener('pause', () => {
      isPlaying = false;
      document.getElementById('play-btn').innerHTML = '<i class="fa-solid fa-play"></i>';
      document.getElementById('player-card').classList.remove('playing');
    });

    function searchMusic(query, btnElement = null) {
      if (btnElement) {
        document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
      }

      const loader = document.getElementById('search-loader');
      loader.style.display = 'block';

      // Primary Saavn Music API
      fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&page=1&limit=25`)
        .then(res => res.json())
        .then(resData => {
          loader.style.display = 'none';
          const results = resData.data ? resData.data.results : (resData.results || []);
          
          if (results && results.length > 0) {
            currentQueue = results.map(item => {
              let img = "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=500";
              if (item.image && item.image.length > 0) {
                img = item.image[item.image.length - 1].url || item.image[0].url;
              }
              let audioUrl = "";
              if (item.downloadUrl && item.downloadUrl.length > 0) {
                audioUrl = item.downloadUrl[item.downloadUrl.length - 1].url || item.downloadUrl[0].url;
              }
              return {
                title: item.name ? item.name.replace(/&quot;/g, '"').replace(/&amp;/g, '&') : "Unknown Track",
                artist: item.primaryArtists ? item.primaryArtists.replace(/&quot;/g, '"').replace(/&amp;/g, '&') : "Artist",
                thumb: img,
                url: audioUrl
              };
            }).filter(s => s.url !== "");

            if (currentQueue.length > 0) {
              currentIndex = 0;
              renderQueue();
              playSongAtIndex(0);
            }
          }
        })
        .catch(err => {
          loader.style.display = 'none';
          console.error("Search Error:", err);
        });
    }

    function handleSearch(event) {
      if (event.key === 'Enter') {
        const query = event.target.value.trim();
        if (query) searchMusic(query);
      }
    }

    function renderQueue() {
      const queueList = document.getElementById('queue-list');
      const queueCount = document.getElementById('queue-count');
      queueList.innerHTML = '';
      queueCount.innerText = `${currentQueue.length} Tracks`;

      currentQueue.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = `queue-item ${idx === currentIndex ? 'active' : ''}`;
        item.onclick = () => playSongAtIndex(idx);
        item.innerHTML = `
          <img class="queue-thumb" src="${song.thumb}" alt="thumb" />
          <div class="queue-details">
            <div class="queue-name">${song.title}</div>
            <div class="queue-artist">${song.artist}</div>
          </div>
          <i class="fa-solid ${idx === currentIndex && isPlaying ? 'fa-volume-high' : 'fa-play'}" style="color:${idx === currentIndex ? '#1db954' : '#64748b'};"></i>
        `;
        queueList.appendChild(item);
      });
      updatePlayerUI();
    }

    function updatePlayerUI() {
      if (currentQueue.length === 0) return;
      const song = currentQueue[currentIndex];
      document.getElementById('track-title').innerText = song.title;
      document.getElementById('artist-name').innerText = song.artist;
      document.getElementById('album-img').src = song.thumb;
    }

    function playSongAtIndex(idx) {
      if (currentQueue.length === 0) return;
      currentIndex = idx;
      renderQueue();

      const song = currentQueue[currentIndex];
      audio.src = song.url;
      audio.play().catch(e => console.log("Playback error:", e));
    }

    function togglePlay() {
      if (!audio.src) return;
      if (isPlaying) {
        audio.pause();
      } else {
        audio.play();
      }
    }

    function nextSong() {
      if (currentQueue.length === 0) return;
      currentIndex = (currentIndex + 1) % currentQueue.length;
      playSongAtIndex(currentIndex);
    }

    function prevSong() {
      if (currentQueue.length === 0) return;
      currentIndex = (currentIndex - 1 + currentQueue.length) % currentQueue.length;
      playSongAtIndex(currentIndex);
    }

    function updateProgress() {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        document.getElementById('progress-fill').style.width = pct + '%';
        document.getElementById('current-time').innerText = formatTime(audio.currentTime);
        document.getElementById('total-duration').innerText = formatTime(audio.duration);
      }
    }

    function seekTrack(event) {
      if (!audio.duration) return;
      const bar = event.currentTarget;
      const rect = bar.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const pct = clickX / rect.width;
      audio.currentTime = audio.duration * pct;
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }
  </script>
</body>
</html>
